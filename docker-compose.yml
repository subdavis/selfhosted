# Services live in ./apps; each file declares the networks it uses.
# project_directory keeps ./etc/... relative paths and .env resolving from the repo root.
include:
  - path: ./apps/adguard.yml
    project_directory: .
  - path: ./apps/backrest.yml
    project_directory: .
  - path: ./apps/media.yml
    project_directory: .
  - path: ./apps/calibre.yml
    project_directory: .
  - path: ./apps/changedetection.yml
    project_directory: .
  - path: ./apps/cloudflare.yml
    project_directory: .
  - path: ./apps/dozzle.yml
    project_directory: .
  - path: ./apps/drone.yml
    project_directory: .
  - path: ./apps/linkding.yml
    project_directory: .
  - path: ./apps/miniflux.yml
    project_directory: .
  - path: ./apps/navidrome.yml
    project_directory: .
  - path: ./apps/kobodl.yml
    project_directory: .
  - path: ./apps/paperless.yml
    project_directory: .
  - path: ./apps/rssglue.yml
    project_directory: .
  - path: ./apps/traefik.yml
    project_directory: .
  - path: ./apps/umami.yml
    project_directory: .
  - path: ./apps/vaultwarden.yml
    project_directory: .
  - path: ./apps/scrutiny.yml
    project_directory: .
  - path: ./apps/watchtower.yml
    project_directory: .

volumes:
  redis-data:
