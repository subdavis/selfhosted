services:

  #############################
  ## PAPERLESS-NGX
  #############################

  paperless_db:
    image: postgres:15.19-alpine
    container_name: paperless_db
    restart: unless-stopped
    volumes:
      - ${PRIMARY_MOUNT}/paperless/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
    networks:
      - paperless-private-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  paperless_broker:
    image: docker.io/valkey/valkey:9.1.2-alpine
    container_name: paperless_broker
    restart: unless-stopped
    volumes:
      - ${SECONDARY_MOUNT}/paperless/valkey:/data
    labels:
      - traefik.enable=false
    networks:
      - paperless-private-net

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.4
    container_name: paperless
    restart: unless-stopped
    depends_on:
      paperless_db:
        condition: service_healthy
      paperless_broker:
        condition: service_started
    volumes:
      - ${PRIMARY_MOUNT}/paperless/data:/usr/src/paperless/data
      - ${PRIMARY_MOUNT}/paperless/media:/usr/src/paperless/media
      - ${PRIMARY_MOUNT}/paperless/export:/usr/src/paperless/export
      - ${PRIMARY_MOUNT}/paperless/consume:/usr/src/paperless/consume
    environment:
      - USERMAP_UID=${PUID:-1000}
      - USERMAP_GID=${PGID:-1000}
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_REDIS=redis://paperless_broker:6379
      - PAPERLESS_DBHOST=paperless_db
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DBPASS=${PAPERLESS_DB_PASSWORD}
      - PAPERLESS_URL=https://paperless.${DNS_DOMAIN}
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_TIME_ZONE=${TIME_ZONE}
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
      - PAPERLESS_ADMIN_MAIL=${PAPERLESS_ADMIN_MAIL}
      - PAPERLESS_REMOTE_OCR_ENGINE=${PAPERLESS_REMOTE_OCR_ENGINE}
      - PAPERLESS_REMOTE_OCR_API_KEY=${PAPERLESS_REMOTE_OCR_API_KEY}
      - PAPERLESS_REMOTE_OCR_ENDPOINT=${PAPERLESS_REMOTE_OCR_ENDPOINT}
    networks:
      - paperless-net
      - paperless-private-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=paperless-net
      - traefik.http.services.paperless-svc.loadbalancer.server.port=8000
      - traefik.http.routers.paperless-rtr.rule=Host(`paperless.${DNS_DOMAIN}`)
      - traefik.http.routers.paperless-rtr.entrypoints=websecure
      - traefik.http.routers.paperless-rtr.tls=true
      - traefik.http.routers.paperless-rtr.middlewares=ipallowlist-mddl@docker,ratelimit-mddl@docker

  #############################
  ## WORKFLOW-EXPLORER
  #############################

  workflow_explorer:
    image: ghcr.io/subdavis/personal-workflows:latest
    container_name: workflow_explorer
    restart: unless-stopped
    user: ${PUID:-1000}
    volumes:
      - ./etc/workflow-explorer/.env:/app/.env:ro
      - ${PRIMARY_MOUNT}/workflow_explorer/data:/app/data
    environment:
      - DBOS_SYSTEM_DATABASE_URL=sqlite:////app/data/workflow_explorer.sqlite
      - DBOS_APP_NAME=workflow-explorer
      - JOBS_QUEUE_CONCURRENCY=1
      - PAPERLESS_URL=http://paperless:8000/api
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gcp_sa
    networks:
      - workflow-explorer-net
      - paperless-private-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=workflow-explorer-net
      - traefik.http.services.workflow-explorer-svc.loadbalancer.server.port=8080
      - traefik.http.routers.workflow-explorer-rtr.rule=Host(`workflows.${DNS_DOMAIN}`)
      - traefik.http.routers.workflow-explorer-rtr.entrypoints=websecure
      - traefik.http.routers.workflow-explorer-rtr.tls=true
      - traefik.http.routers.workflow-explorer-rtr.middlewares=ipallowlist-mddl@docker
    secrets:
      - gcp_sa

networks:
  paperless-net:
    name: paperless-net
  paperless-private-net:
    name: paperless-private-net
  workflow-explorer-net:
    name: workflow-explorer-net

secrets:
  gcp_sa:
    file: ./etc/secrets/service-account.json # gitignored locally
