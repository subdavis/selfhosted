services:

  #############################
  ## ARRS
  #############################

  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:develop
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PUID:-1000}
      - TZ=${TIME_ZONE}
    volumes:
      - ${PRIMARY_MOUNT}/prowlarr/config:/config
    labels:
      - traefik.enable=true
      - traefik.docker.network=arr-net
      - traefik.http.services.prowlarr-svc.loadbalancer.server.port=9696
      - traefik.http.routers.prowlarr-rtr.rule=Host(`prowlarr.${DNS_DOMAIN}`)
      - traefik.http.routers.prowlarr-rtr.entrypoints=websecure
      - traefik.http.routers.prowlarr-rtr.tls=true
      - traefik.http.routers.prowlarr-rtr.middlewares=ipallowlist-mddl@docker,traefik-forward-auth@docker
    restart: unless-stopped
    networks:
      - arr-net

  radarr:
    image: ghcr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PUID:-1000}
      - TZ=${TIME_ZONE}
    labels:
      - traefik.enable=true
      - traefik.docker.network=arr-net
      - traefik.http.services.radarr-svc.loadbalancer.server.port=7878
      - traefik.http.routers.radarr-rtr.rule=Host(`radarr.${DNS_DOMAIN}`)
      - traefik.http.routers.radarr-rtr.entrypoints=websecure
      - traefik.http.routers.radarr-rtr.tls=true
      - traefik.http.routers.radarr-rtr.middlewares=ipallowlist-mddl@docker
    volumes:
      - ${PRIMARY_MOUNT}/radarr/data:/config
      - ${MEDIA_MOUNT}/plex/media/:/data
    networks:
      - arr-net

  sonarr:
    image: ghcr.io/linuxserver/sonarr
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PUID:-1000}
      - TZ=${TIME_ZONE}
    labels:
      - traefik.enable=true
      - traefik.docker.network=arr-net
      - traefik.http.services.sonarr-svc.loadbalancer.server.port=8989
      - traefik.http.routers.sonarr-rtr.rule=Host(`sonarr.${DNS_DOMAIN}`)
      - traefik.http.routers.sonarr-rtr.entrypoints=websecure
      - traefik.http.routers.sonarr-rtr.tls=true
      - traefik.http.routers.sonarr-rtr.middlewares=ipallowlist-mddl@docker
    volumes:
      - ${PRIMARY_MOUNT}/sonarr/data:/config
      - ${MEDIA_MOUNT}/plex/media/:/data
    networks:
      - arr-net

  lidarr:
    image: ghcr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TIME_ZONE}
    volumes:
      - ${PRIMARY_MOUNT}/lidarr/config:/config
      - ${MEDIA_MOUNT}/plex/media/:/data
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=arr-net
      - traefik.http.services.lidarr-svc.loadbalancer.server.port=8686
      - traefik.http.routers.lidarr-rtr.rule=Host(`lidarr.${DNS_DOMAIN}`)
      - traefik.http.routers.lidarr-rtr.entrypoints=websecure
      - traefik.http.routers.lidarr-rtr.tls=true
      - traefik.http.routers.lidarr-rtr.middlewares=ipallowlist-mddl@docker
    networks:
      - arr-net

  #############################
  ## JELLYFIN
  #############################

  jellyfin:
    image: lscr.io/linuxserver/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=plex-net
      - traefik.http.services.jellyfin-svc.loadbalancer.server.port=8096
      - traefik.http.routers.jellyfin-rtr.rule=Host(`jellyfin.${DNS_DOMAIN}`)
      - traefik.http.routers.jellyfin-rtr.entrypoints=websecure
      - traefik.http.routers.jellyfin-rtr.tls=true
    environment:
      - "TZ=${TIME_ZONE}"
      - "PUID=${PUID:-1000}"
      - "PGID=${PUID:-1000}"
      - "JELLYFIN_PublishedServerUrl=jellyfin.${DNS_DOMAIN}"
    volumes:
      - ${PRIMARY_MOUNT}/jellyfin/config:/config
      - ${MEDIA_MOUNT}/plex/media:/data
    devices:
      - /dev/dri:/dev/dri
    networks:
      - plex-net

  #############################
  ## QBITTORRENT + GLUETUN
  #############################

  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      # deliberately NOT autoheal=true: gluetun restarts the tunnel in-place on
      # its own healthcheck failure. letting autoheal kill the container instead
      # SIGTERMs openvpn mid-handshake and it never finishes connecting.
      - traefik.enable=true
      - traefik.docker.network=transmission-net
      - traefik.http.services.qbittorrent-svc.loadbalancer.server.port=8080
      - traefik.http.routers.qbittorrent-rtr.rule=Host(`torrent.${DNS_DOMAIN}`)
      - traefik.http.routers.qbittorrent-rtr.entrypoints=websecure
      - traefik.http.routers.qbittorrent-rtr.tls=true
      # no forward-auth: ip allowlist + qbittorrent's own webui password.
      # the webui's "bypass authentication for whitelisted subnets" must stay OFF:
      # every request arrives from traefik's container IP, so any 172.16/12
      # whitelist silently disables the password.
      - traefik.http.routers.qbittorrent-rtr.middlewares=ipallowlist-mddl@docker
    networks:
      - arr-net
      - transmission-net
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${PRIMARY_MOUNT}/gluetun/config:/gluetun
    environment:
      - TZ=${TIME_ZONE}
      - VPN_SERVICE_PROVIDER=private internet access
      # PIA has no native wireguard support in gluetun; openvpn is the only
      # documented path for provider=private internet access.
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${TORRENT_USERNAME}
      - OPENVPN_PASSWORD=${TORRENT_PASSWORD}
      - SERVER_REGIONS=${PIA_REGIONS}
      # protocol/preset left at gluetun defaults (udp, strong / AES-256-GCM).
      # the connect failures were stale baked-in server IPs, not ports: refresh
      # with `gluetun update -providers` after pulling a new image.
      # if udp won't connect once the list is fresh, try OPENVPN_PROTOCOL=tcp.
      - VPN_PORT_FORWARDING=on
      # note: true/false, NOT on/off. refuses to pick a non-PF server.
      - PORT_FORWARD_ONLY=true
      - FIREWALL_OUTBOUND_SUBNETS=${LOCAL_NETWORK}
      # refresh the server list periodically so baked-in IPs can't go stale again.
      # wiki says no less than 360h. note this only fires one period after start
      # and runs through the tunnel, so it can't bootstrap a dead list: for that,
      # use the one-shot `gluetun update -providers` CLI.
      - UPDATER_PERIOD=480h
      # push the forwarded port into qbittorrent on every renewal. verbatim from
      # the gluetun wiki (setup/advanced/vpn-port-forwarding.md). the DOWN command
      # is required too: qbittorrent has a reconnect bug without it.
      # needs "Bypass authentication for clients on localhost" in the qbt webui.
      - |-
        VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      - |-
        VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'

  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    # shares gluetun's network namespace, so it has no `networks` of its own.
    # the *arr apps and traefik reach it at gluetun:8080.
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    labels:
      - autoheal=true
    mem_limit: 1g
    mem_reservation: 256m
    volumes:
      - ${PRIMARY_MOUNT}/qbittorrent/config:/config
      - ${MEDIA_MOUNT}/plex/media/:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PUID:-1000}
      - TZ=${TIME_ZONE}
      - WEBUI_PORT=8080
    # tests egress, not the webui: if gluetun restarts, this container is left in a
    # dead netns with a working loopback, so localhost:8080 would still answer.
    # plain http on purpose (no TLS dep), and curl-or-wget so a missing binary
    # can't wedge autoheal into a restart loop. not gluetun's control server:
    # that requires auth by default since ~v3.39.1.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 10 -o /dev/null http://cp.cloudflare.com/generate_204 2>/dev/null || wget -q -T 10 -O /dev/null http://cp.cloudflare.com/generate_204"]
      interval: 1m
      timeout: 15s
      start_period: 3m
      retries: 3

  # restarts containers labelled autoheal=true when their healthcheck fails.
  # docker itself never acts on an unhealthy container.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    network_mode: none
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  arr-net:
    name: arr-net
  plex-net:
    name: plex-net
  transmission-net:
    name: transmission-net
