services:

  #############################
  ## SCRUTINY
  #############################

  scrutiny:
    image: ghcr.io/starosdev/scrutiny:1.76.9-omnibus
    container_name: scrutiny
    restart: unless-stopped
    cap_add:
      - SYS_RAWIO
    volumes:
      - ${SECONDARY_MOUNT}/scrutiny/config:/opt/scrutiny/config
      - ${SECONDARY_MOUNT}/scrutiny/influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
    devices:
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
      - /dev/sdc:/dev/sdc
      - /dev/sdd:/dev/sdd
      - /dev/sde:/dev/sde
    networks:
      - scrutiny-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=scrutiny-net
      - traefik.http.services.scrutiny-svc.loadbalancer.server.port=8080
      - traefik.http.routers.scrutiny-rtr.rule=Host(`scrutiny.${DNS_DOMAIN}`)
      - traefik.http.routers.scrutiny-rtr.entrypoints=websecure
      - traefik.http.routers.scrutiny-rtr.tls=true
      - traefik.http.routers.scrutiny-rtr.middlewares=ipallowlist-mddl@docker,traefik-forward-auth@docker

networks:
  scrutiny-net:
    name: scrutiny-net
